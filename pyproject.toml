[project]
name = "duewright"
version = "0.1.0"
description = "A task manager with a tested Python core, a CLI, and a FastAPI REST API."
readme = "README.md"
authors = [
    { name = "David Mghongo", email = "mwandairodavid@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
duewright = "duewright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# ruff defaults plus isort: keep imports tidy from the first commit.
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.16.9",
]
